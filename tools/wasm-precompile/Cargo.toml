[package]
name = "wasm-precompile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "AOT pre-compiler for WASM components targeting the enclave-os WASM runtime."

[[bin]]
name = "wasm-precompile"
path = "src/main.rs"

[dependencies]
honest-wasmtime-profile = { path = "../../crates/honest-wasmtime-profile", features = ["aot"] }

# Closed memory64 toolchain reconstructed from Mini patches/wasm64.
[patch."https://github.com/Privasys/wasmtime"]
wasmtime = { path = "../../third_party/wasm64/wasmtime/crates/wasmtime" }

[patch.crates-io]
wasmparser = { path = "../../third_party/wasm64/wasm-tools/crates/wasmparser" }
