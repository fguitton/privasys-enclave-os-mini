[package]
name = "wasm-precompile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "AOT pre-compiler for WASM components targeting the enclave-os WASM runtime."

[[bin]]
name = "wasm-precompile"
path = "src/main.rs"

[dependencies]
honest-wasmtime-profile = { path = "../../crates/honest-wasmtime-profile", features = ["aot"] }
