[package]
name = "honest-wasmtime-profile"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "AGPL-3.0"
description = "Shared Wasmtime role boundary for Honest enclave and AOT builds."

[workspace]

[features]
default = []
descriptor = []
runtime-sgx = ["wasmtime/sgx"]
aot = ["wasmtime/cranelift", "wasmtime/parallel-compilation"]

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
wasmtime = { git = "https://github.com/Privasys/wasmtime", rev = "6d01615eaf52d4e70010290f8444a8ec285d01ae", default-features = false, features = [
    "component-model-memory64-only",
    "runtime",
    "std",
    "gc-drc",
] }

[target.'cfg(target_vendor = "teaclave")'.dependencies]
enclave-os-common = { path = "../../common" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("teaclave"))'] }

# Closed memory64 toolchain reconstructed from Mini patches/wasm64.
[patch."https://github.com/Privasys/wasmtime"]
wasmtime = { path = "../../third_party/wasm64/wasmtime/crates/wasmtime" }

[patch.crates-io]
wasmparser = { path = "../../third_party/wasm64/wasm-tools/crates/wasmparser" }
