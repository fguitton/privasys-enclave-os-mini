[package]
name = "enclave-os-egress"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "HTTPS egress module for enclave-os — outbound TLS from inside SGX."

[lib]
name = "enclave_os_egress"

[features]
# Mock mode — accepts MOCK_QUOTE: prefixed quotes without verification.
# Only enable for development/testing on platforms without SGX hardware.
mock = []
# Accept the distinctly typed report emitted by an enclave executing through
# Intel SGX SDK simulation. Never enabled by default or by release packaging.
sgx-sim-attestation = []
# Host-side RA-TLS clients need the quote layout types as a normal Cargo
# dependency. Enclave builds leave this disabled because `sgx_types` is
# supplied by the Teaclave sysroot there.
native-sgx-types = ["dep:sgx_types", "enclave-os-common/jwt"]

[dependencies]
# Shared types, module trait, and OCall vtable
enclave-os-common = { path = "../../common", features = ["crypto", "jwt"] }

# TLS (Privasys fork with RA-TLS 0xFFBB challenge extension)
rustls = { git = "https://github.com/Privasys/rustls", tag = "privasys-v0.8.1", default-features = false, features = ["ring", "tls12", "std"] }

# Mozilla root CAs for general-purpose HTTPS egress (WASM SDK, etc.)
webpki-roots = "0.26"

# Crypto (for CA bundle hashing + ReportData verification)
ring = "0.17"
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

# Certificate parsing (for RA-TLS quote extraction + ReportData verification)
x509-parser = "0.16"

# Attestation server verification (JSON request/response)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

# Native-only source for the quote layout types. This is the same pinned SDK
# revision used by the enclave; it must not be enabled in Teaclave builds.
sgx_types = { git = "https://github.com/Privasys/teaclave-sgx-sdk", tag = "privasys-v0.4.0", optional = true }
