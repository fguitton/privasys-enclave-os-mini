[package]
name = "enclave-os-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "WASM module for enclave-os — WebAssembly Component runtime inside SGX."

[lib]
name = "enclave_os_wasm"

# This crate is composed into the enclave build (see enclave/Cargo.toml)
# and is not a member of the root workspace. The empty table opts out of
# workspace inference so `cargo check` / `cargo test` work from this dir.
[workspace]

[dependencies]
# Shared types, module trait, OCall vtable, hex utils, JWT/JWKS verification
enclave-os-common = { path = "../../common", features = ["jwt"] }
enclave-os-kvstore = { path = "../enclave-os-kvstore" }
enclave-os-egress = { path = "../enclave-os-egress" }
honest-wasmtime-profile = { path = "../honest-wasmtime-profile", features = ["runtime-sgx"] }

# FIDO2 session token validation (optional — only needed when apps use FIDO2 auth)
enclave-os-fido2 = { path = "../enclave-os-fido2", optional = true }

# Per-app role management (optional — enclave-managed RBAC for FIDO2 users)
enclave-os-app-auth = { path = "../enclave-os-app-auth", optional = true }

# Crypto (SHA-256 for WASM code hashing, RNG for WASI random)
ring = "0.17"

# Serialization for WasmCall / WasmResult protocol
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 decoding of WasmLoad.bytes wire format.
base64 = { version = "0.21", default-features = false, features = ["alloc"] }

# wasi:random — RDRAND hardware RNG inside SGX (no OCALL)
getrandom = { version = "0.2", features = ["rdrand"] }

[features]
# Enable FIDO2 session token validation for wasm app authentication.
# When enabled, apps with `"fido2": true` in their permissions can accept
# FIDO2 session tokens in `app_auth` alongside (or instead of) OIDC JWTs.
fido2 = ["dep:enclave-os-fido2"]

# Enable enclave-managed per-app role-based access control.
# When enabled, FIDO2-authenticated users get roles stored in the app's
# sealed KV space.  The first user auto-bootstraps as admin.
app-auth = ["dep:enclave-os-app-auth"]
