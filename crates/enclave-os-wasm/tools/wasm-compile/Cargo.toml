[package]
name = "enclave-os-wasm-compile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "AOT compiler for WASM components targeting enclave-os."

[workspace]

[[bin]]
name = "enclave-os-wasm-compile"
path = "src/main.rs"

[dependencies]
honest-wasmtime-profile = { path = "../../../honest-wasmtime-profile", features = ["aot"] }
clap = { version = "4", features = ["derive"] }
