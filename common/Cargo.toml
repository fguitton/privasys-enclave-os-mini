[package]
name = "enclave-os-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types and protocol definitions for enclave-os-mini"

[features]
# Explicit new-SDK loan API; native/default allocator behavior stays unchanged.
fallible-allocation-v1 = []
# Native admission proofs require the verified build-owned request JSON source.
request-json-tests = ["crypto", "jwt", "request-json-parser", "serde_json/std"]
# Pool-explicit parser; requires the verified build-owned JSON supplier.
request-json-parser = []
default = ["std"]
std = []
# Mutable attestation endpoints/tokens require real runtime synchronization.
# std+crypto retains the historical public store for existing callers.
attestation-server-store = ["std", "crypto"]
# Pure no_std requires --no-default-features --features sgx.
# Explicit std (including the runtime store) takes precedence over sgx.
sgx = []
# Cryptographic primitives (ring) — used by quote::compute_report_data_hash
crypto = ["dep:ring", "dep:base64"]
# JWT verification & encoding (ECDSA P-256 / ES256)
jwt = ["crypto", "dep:base64"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
httparse = { version = "1", default-features = false }

# Optional: only pulled in when the `jwt` feature is enabled
ring       = { version = "0.17", optional = true }
base64     = { version = "0.21", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
ring = "0.17"
base64 = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("teaclave"))', 'cfg(feature, values("mock", "sgx-sim-attestation"))'] }

[[test]]
name = "btree_node_allocation"
required-features = ["fallible-allocation-v1"]
